# 随心规则 · clashmi
# 本地替换 Airport 的订阅 URL；自建节点写入 proxies 并替换 Self 的 REJECT。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
tun:
  enable: true
  stack: mixed
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: true
  auto-detect-interface: true
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com
dns:
  enable: true
  ipv6: false
  respect-rules: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost
  - link-ip.nextdns.io
  - '*.msftconnecttest.com'
  - '*.msftncsi.com'
  - '*.srv.nintendo.net'
  - '*.stun.playstation.net'
  - xbox.*.microsoft.com
  - '*.xboxlive.com'
  - '*.logon.battlenet.com.cn'
  - '*.logon.battle.net'
  - stun.l.google.com
  - time.*.apple.com
  - ntp.*.com
  - '*.pool.ntp.org'
  - captive.apple.com
proxies: []
proxy-providers:
  Airport:
    type: http
    url: https://raw.githubusercontent.com/caozzzzz/suixin-rules/main/examples/clash-subscription.yaml
    path: ./proxy_provider/airport.yaml
    interval: 86400
    health-check:
      enable: false
      url: http://cp.cloudflare.com/generate_204
      interval: 600
proxy-groups:
- name: Airport
  type: select
  use:
  - Airport
- name: Self
  type: select
  proxies:
  - REJECT
- name: Proxy🪁
  type: select
  proxies:
  - Airport
  - Self
- name: 兜底
  type: select
  proxies:
  - Proxy🪁
  - DIRECT
- name: Netflix
  type: select
  proxies:
  - Proxy🪁
  - Airport
  - Self
- name: Telegram
  type: select
  proxies:
  - Proxy🪁
  - Airport
  - Self
- name: Twitter
  type: select
  proxies:
  - Proxy🪁
  - Airport
  - Self
- name: TikTok
  type: select
  proxies:
  - Proxy🪁
  - Airport
  - Self
- name: AI
  type: select
  proxies:
  - Self
  - Airport
  - Proxy🪁
- name: Spotify
  type: select
  proxies:
  - Proxy🪁
  - Airport
  - Self
- name: YouTube
  type: select
  proxies:
  - Proxy🪁
  - Airport
  - Self
- name: YouTube-Music
  type: select
  proxies:
  - Proxy🪁
  - Airport
  - Self
- name: Apple-AI
  type: select
  proxies:
  - Proxy🪁
  - Self
  - Airport
  - DIRECT
- name: Apple
  type: select
  proxies:
  - DIRECT
  - Proxy🪁
- name: AdBlock
  type: select
  proxies:
  - REJECT
  - DIRECT
rule-providers:
