# Clash Verge Rev / Mihomo
# Adapted from caozzzzz/surge-rules
# Regional groups removed: US / HK / SG / TW

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  ipv6: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
    - "link-ip.nextdns.io"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "*.xboxlive.com"
    - "*.logon.battlenet.com.cn"
    - "*.logon.battle.net"
    - "stun.l.google.com"

proxies:
  - name: "Snell5"
    type: snell
    server: 161.153.0.188
    port: 17811
    psk: "YOUR_SNELL_PSK"
    version: 5

proxy-providers:
  Airport:
    type: http
    url: "https://example.com/你的Clash订阅"
    path: ./proxy_provider/airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600

proxy-groups:
  - name: "Proxy🪁"
    type: select
    proxies:
      - "Snell5"
    use:
      - Airport

  - name: "Final"
    type: select
    proxies:
      - "Proxy🪁"
      - DIRECT

  - name: "Netflix"
    type: select
    proxies:
      - "Proxy🪁"

  - name: "Telegram"
    type: select
    proxies:
      - "Proxy🪁"

  - name: "Twitter"
    type: select
    proxies:
      - "Proxy🪁"

  - name: "TikTok"
    type: select
    proxies:
      - "Proxy🪁"

  - name: "AI"
    type: select
    proxies:
      - "Proxy🪁"

  - name: "Spotify"
    type: select
    proxies:
      - "Proxy🪁"

  - name: "YouTube"
    type: select
    proxies:
      - "Proxy🪁"

  - name: "YouTube-Music"
    type: select
    proxies:
      - "Proxy🪁"

  - name: "Apple-AI"
    type: select
    proxies:
      - "Proxy🪁"
      - DIRECT

  - name: "Apple"
    type: select
    proxies:
      - DIRECT
      - "Proxy🪁"

  - name: "AdBlock"
    type: select
    proxies:
      - REJECT
      - DIRECT

rule-providers:
